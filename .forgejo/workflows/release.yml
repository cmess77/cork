# Publishes a release for a vX.Y.Z tag pushed by hand, or re-run by
# workflow_dispatch. Normal releases need neither: ci.yml cuts and publishes
# one on each push to main that has a feat, fix, or perf commit, because a tag
# pushed with the workflow token does not start this workflow. The push
# mirror carries every tag to GitHub, where .github/workflows/release.yml
# publishes the same APK.
#
# Repository secrets (Settings > Actions > Secrets): CORK_KEYSTORE_BASE64,
# CORK_KEYSTORE_PASSWORD.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  release:
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and Flutter
        run: bash tool/ci/setup_toolchain.sh

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed APK
        env:
          CORK_KEYSTORE_BASE64: ${{ secrets.CORK_KEYSTORE_BASE64 }}
          CORK_KEYSTORE_PASSWORD: ${{ secrets.CORK_KEYSTORE_PASSWORD }}
        run: bash tool/ci/build_release_apk.sh

      - name: Publish Forgejo release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/publish_forgejo_release.sh "$GITHUB_REF_NAME"
