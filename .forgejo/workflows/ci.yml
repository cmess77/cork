# Analyze and test every push and PR to main. A push to main with a feat,
# fix, or perf commit since the last release then cuts that release: it
# commits the changelog and version, tags, pushes, and publishes the signed
# APK. The push
# mirror carries the tag to GitHub, which publishes the same APK there.
#
# `runs-on: default` matches the registered Forgejo runner label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  check:
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and Flutter
        run: bash tool/ci/setup_toolchain.sh

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get

      - name: Conventional Commits since the last release
        run: dart tool/release.dart lint

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CORK_KEYSTORE_BASE64: ${{ secrets.CORK_KEYSTORE_BASE64 }}
          CORK_KEYSTORE_PASSWORD: ${{ secrets.CORK_KEYSTORE_PASSWORD }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Cork release'
          git config user.email 'release@cork.invalid'
          before="$(git rev-parse HEAD)"
          dart tool/release.dart cut --if-needed
          [ "$(git rev-parse HEAD)" != "$before" ] || exit 0
          tag="$(git describe --tags --exact-match HEAD)"
          git push --follow-tags origin HEAD:main
          bash tool/ci/build_release_apk.sh "$tag"
          bash tool/ci/publish_forgejo_release.sh "$tag"
