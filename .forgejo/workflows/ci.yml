# Analyze and test every push and PR to main. Installable APKs come from
# release.yml, which runs when a vX.Y.Z tag is pushed.
#
# `runs-on: default` matches the registered Forgejo runner label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  check:
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and Flutter
        run: bash tool/ci/setup_toolchain.sh

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
