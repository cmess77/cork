# Analyze and test every push and PR to main. A push to main (or a manual run
# on main) then releases: `cut --if-needed` commits the changelog and version
# and tags when a feat, fix, or perf commit is waiting, and a hand-cut tag
# pushed with main is already HEAD. Unless the Forgejo release for that tag
# is complete, the job builds the signed APK, pushes the release commit and
# tag atomically, then publishes. Building before pushing means a failed
# build leaves no orphan tag, and every step skips work already done, so
# re-running the job (workflow_dispatch) finishes a release that crashed.
# The push mirror carries the tag to GitHub, which publishes the same APK.
#
# `runs-on: default` matches the registered Forgejo runner label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  check:
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The release tool reads the last release from tags.
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and Flutter
        run: bash tool/ci/setup_toolchain.sh

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get

      - name: Conventional Commits since the last release
        run: dart tool/release.dart lint

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CORK_KEYSTORE_BASE64: ${{ secrets.CORK_KEYSTORE_BASE64 }}
          CORK_KEYSTORE_PASSWORD: ${{ secrets.CORK_KEYSTORE_PASSWORD }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Cork release'
          git config user.email 'release@cork.invalid'
          before="$(git rev-parse HEAD)"
          dart tool/release.dart cut --if-needed
          tag="$(git describe --tags --exact-match HEAD 2>/dev/null)" || exit 0
          bash tool/ci/forgejo_release.sh complete "$tag" && exit 0
          bash tool/ci/build_release_apk.sh "$tag"
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push --atomic origin HEAD:main "$tag"
          fi
          bash tool/ci/forgejo_release.sh publish "$tag"
